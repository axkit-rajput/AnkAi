<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover pairs with the safe-area padding in index.css so the
         layout reaches the edges on notched phones without hiding controls. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#080a0d" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="AnkAI - one workspace where specialised agents chat, search, read PDFs, analyse images and write code."
    />
    <title>AnkAI</title>

    <!-- Loaded here rather than via @import in CSS: an @import inside the
         stylesheet is discovered only after the CSS downloads, which delays
         first paint by a whole round trip. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- defer: the checkout script is only needed once the billing drawer is
         opened, so it must not block parsing of the app bundle. -->
    <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
